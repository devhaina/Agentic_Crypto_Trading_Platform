# =============================================================================
# Agentiva — Agentic Crypto Trading Platform
# Local development stack.
#
#   cp .env.example .env     then edit .env
#   docker compose up --build
#
# Once healthy:
#
#   Dashboard            http://localhost:4200
#   API gateway          http://localhost:8080/swagger
#   Gateway health       http://localhost:8080/health
#   AI agent platform    http://localhost:8000/swagger
#   RabbitMQ management  http://localhost:15672
#   Grafana              http://localhost:3000
#   Prometheus           http://localhost:9090
#
# PHASE 1 DOES NOT CONNECT TO AN EXCHANGE. Every service starts in PAPER mode,
# and live trading additionally requires TRADING__ALLOWLIVE=true plus a
# credential set that this file never provides to anything but the Execution
# Service.
# =============================================================================

# Project name is "agentiva-platform", not "agentiva". A separate, unrelated
# project on a developer machine may already use the shorter name, and sharing
# it would let `docker compose down` here delete that project's containers and
# volumes.
name: agentiva-platform

# -----------------------------------------------------------------------------
# Shared fragments
#
# YAML anchors rather than copy-paste: thirteen services need identical
# logging, restart and telemetry settings, and a divergence between them is
# discovered during an incident.
# -----------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    # Bounded, so a chatty service cannot fill a developer's disk overnight.
    max-size: "20m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [agentiva]

  # Resource limits on every container. Without them a single runaway service
  # can starve the rest of the stack, and the failure looks like an unrelated
  # service being slow.
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
      reservations:
        memory: 128M

# Configuration every .NET service receives. Note what is absent: no exchange
# credentials. Only the Execution Service is given those.
x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ASPNETCORE_URLS: http://+:8080
  TZ: UTC

  # Double underscore is the .NET configuration separator, so these bind
  # straight onto the options classes.
  ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false

  RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
  RabbitMq__Port: ${RABBITMQ_PORT:-5672}
  RabbitMq__UserName: ${RABBITMQ_USER}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}
  RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}

  Jwt__Issuer: ${JWT__ISSUER}
  Jwt__Audience: ${JWT__AUDIENCE}
  Jwt__SigningKey: ${JWT__SIGNINGKEY}

  Trading__Mode: ${TRADING__MODE:-PAPER}
  Trading__AllowLive: ${TRADING__ALLOWLIVE:-false}
  Trading__KillSwitchEnabled: ${TRADING__KILLSWITCHENABLED:-false}
  Trading__QuoteAsset: USDT

  Serilog__MinimumLevel: ${SERILOG__MINIMUMLEVEL:-Information}
  Loki__Url: ${LOKI_URL:-http://loki:3100}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

x-dotnet-healthcheck: &dotnet-healthcheck
  test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/alive"]
  interval: 15s
  timeout: 5s
  retries: 5

  # Long enough for the service to apply its EF migrations before the first
  # probe. A shorter period restarts the container mid-migration, which in the
  # worst case leaves a half-applied schema.
  start_period: 60s

networks:
  agentiva:
    driver: bridge

volumes:
  postgres-data:
  timescale-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ===========================================================================
  # Data stores
  # ===========================================================================

  postgres:
    image: postgres:17-alpine
    container_name: agentiva-platform-postgres
    <<: *service-defaults
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

      # Scrypt rather than the default md5. Cheap to set correctly now.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

      # Runs once, on an empty data directory. Creates one database per service.
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg17
    container_name: agentiva-platform-timescaledb
    <<: *service-defaults
    environment:
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
      POSTGRES_DB: ${TIMESCALE_DB:-market_db}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${TIMESCALE_HOST_PORT:-5433}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./infrastructure/timescale/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER} -d ${TIMESCALE_DB:-market_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: agentiva-platform-redis
    <<: *service-defaults
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: agentiva-platform-rabbitmq
    <<: *service-defaults
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      # check_running plus check_port_connectivity: the broker accepts TCP
      # before it is ready to serve, and a service that connects too early
      # fails its first publish.
      test: ["CMD", "rabbitmq-diagnostics", "check_running", "--quiet"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # ===========================================================================
  # Observability
  # ===========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: agentiva-platform-otel-collector
    <<: *service-defaults
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infrastructure/monitoring/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8889"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 448M

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: agentiva-platform-prometheus
    <<: *service-defaults
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  loki:
    image: grafana/loki:3.3.2
    container_name: agentiva-platform-loki
    <<: *service-defaults
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: agentiva-platform-grafana
    <<: *service-defaults
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      # Anonymous access is off. A dashboard showing positions and P&L is not
      # something to leave open, even locally.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # API gateway
  # ===========================================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: agentiva/api-gateway:dev
    container_name: agentiva-platform-api-gateway
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_HOST_PORT:-4200}
      Cors__AllowedOrigins__1: http://localhost:${GATEWAY_HOST_PORT:-8080}

      # Topology is declared by the owning services, not by the gateway.
      RabbitMq__DeclareTopologyOnStartup: "false"
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  # ===========================================================================
  # Platform services
  #
  # Each owns its own database and is independently deployable. Only the
  # Execution Service receives exchange credentials.
  # ===========================================================================

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    image: agentiva/identity-service:dev
    container_name: agentiva-platform-identity-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=identity_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${IDENTITY_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  market-data-service:
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    image: agentiva/market-data-service:dev
    container_name: agentiva-platform-market-data-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Timescale: Host=timescaledb;Port=5432;Database=${TIMESCALE_DB:-market_db};Username=${TIMESCALE_USER};Password=${TIMESCALE_PASSWORD}
      MarketData__Symbols: ${MARKETDATA__SYMBOLS:-BTCUSDT,ETHUSDT}
      MarketData__Timeframes: ${MARKETDATA__TIMEFRAMES:-15m,1h}
      MarketData__StalenessThresholdSeconds: ${MARKETDATA__STALENESSTHRESHOLDSECONDS:-30}
      Binance__UseTestnet: ${BINANCE__USETESTNET:-true}
      Binance__WsBaseUrl: ${BINANCE__WSBASEURL}
    ports:
      - "${MARKETDATA_HOST_PORT}:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  trading-service:
    build:
      context: .
      dockerfile: services/trading-service/Dockerfile
    image: agentiva/trading-service:dev
    container_name: agentiva-platform-trading-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=trading_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Services__RiskServiceUrl: http://risk-service:8080
      Services__ExecutionServiceUrl: http://execution-service:8080
      Services__PortfolioServiceUrl: http://portfolio-service:8080
      PaperPortfolio__StartingEquity: "10000"
    ports:
      - "${TRADING_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      risk-service:
        condition: service_started
    healthcheck: *dotnet-healthcheck

  risk-service:
    build:
      context: .
      dockerfile: services/risk-service/Dockerfile
    image: agentiva/risk-service:dev
    container_name: agentiva-platform-risk-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=risk_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      PaperPortfolio__StartingEquity: "10000"
    ports:
      - "${RISK_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  execution-service:
    build:
      context: .
      dockerfile: services/execution-service/Dockerfile
    image: agentiva/execution-service:dev
    container_name: agentiva-platform-execution-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=execution_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      # ---------------------------------------------------------------------
      # Exchange credentials. The ONLY service that receives them.
      #
      # Blank in Phase 1: no exchange connection is made. An architecture test
      # asserts that no other service's source references these variables.
      # ---------------------------------------------------------------------
      Binance__UseTestnet: ${BINANCE__USETESTNET:-true}
      Binance__RestBaseUrl: ${BINANCE__RESTBASEURL}
      Binance__ApiKey: ${BINANCE__APIKEY:-}
      Binance__ApiSecret: ${BINANCE__APISECRET:-}
    ports:
      - "${EXECUTION_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    image: agentiva/portfolio-service:dev
    container_name: agentiva-platform-portfolio-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=portfolio_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${PORTFOLIO_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  strategy-service:
    build:
      context: .
      dockerfile: services/strategy-service/Dockerfile
    image: agentiva/strategy-service:dev
    container_name: agentiva-platform-strategy-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=strategy_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${STRATEGY_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  backtesting-service:
    build:
      context: .
      dockerfile: services/backtesting-service/Dockerfile
    image: agentiva/backtesting-service:dev
    container_name: agentiva-platform-backtesting-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=backtesting_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${BACKTESTING_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  reconciliation-service:
    build:
      context: .
      dockerfile: services/reconciliation-service/Dockerfile
    image: agentiva/reconciliation-service:dev
    container_name: agentiva-platform-reconciliation-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=reconciliation_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${RECONCILIATION_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: agentiva/notification-service:dev
    container_name: agentiva-platform-notification-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=notification_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${NOTIFICATION_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    image: agentiva/audit-service:dev
    container_name: agentiva-platform-audit-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=audit_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${AUDIT_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  configuration-service:
    build:
      context: .
      dockerfile: services/configuration-service/Dockerfile
    image: agentiva/configuration-service:dev
    container_name: agentiva-platform-configuration-service
    <<: *service-defaults
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=configuration_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${CONFIGURATION_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  # ===========================================================================
  # AI agent platform
  #
  # Holds NO exchange credentials and has no execution tools. Reaches market and
  # portfolio data only through the gateway's read-only routes.
  # ===========================================================================

  agent-platform:
    build:
      context: ./ai/agent-platform
      dockerfile: Dockerfile
    image: agentiva/agent-platform:dev
    container_name: agentiva-platform-agent-platform
    <<: *service-defaults
    environment:
      AI_ENVIRONMENT: ${AGENTIVA_ENVIRONMENT:-local}
      AI_LOG_LEVEL: ${SERILOG__MINIMUMLEVEL:-INFO}

      # "stub" runs deterministic rule-based analysis, which is the Phase 1
      # default and keeps the stack runnable with no vendor account.
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-stub}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-claude-sonnet-5}
      AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      AI_AGENT_TIMEOUT_SECONDS: ${AI_AGENT_TIMEOUT_SECONDS:-60}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}

      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-http://api-gateway:8080}
      AI_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AI_RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      AI_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      TZ: UTC
    ports:
      - "${AI_HOST_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/alive"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # Dashboard
  # ===========================================================================

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agentiva/dashboard:dev
    container_name: agentiva-platform-dashboard
    <<: *service-defaults
    environment:
      # Injected into index.html at container start, so the same image works in
      # every environment. See frontend/docker-entrypoint.sh.
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8080}
      APP_ENVIRONMENT: ${AGENTIVA_ENVIRONMENT:-local}
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:8080"
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
