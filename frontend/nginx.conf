# =============================================================================
# Agentiva dashboard — nginx
#
# Serves the built Angular bundle. It does not proxy the API: the browser calls
# the gateway directly on its own origin, and the gateway owns CORS. Proxying
# here would put a second, redundant place to configure routing and would hide
# gateway errors behind nginx's.
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ----------------------------------------------------
    #
    # A trading dashboard displays balances and can submit orders, so it is
    # worth hardening even behind an authenticated gateway.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Angular needs no inline script at runtime; styles are extracted. The
    # connect-src is left permissive because the gateway's origin differs per
    # environment and is injected at container start — a deployment should
    # tighten this to its actual gateway origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # --- Health --------------------------------------------------------------
    location = /alive {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"Healthy"}';
    }

    location = /ready {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"Healthy"}';
    }

    # --- Static assets -------------------------------------------------------
    #
    # Angular emits content-hashed filenames, so these are safe to cache
    # permanently. index.html must never be, or a deploy would not reach a
    # browser holding a cached copy.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # --- SPA routing ---------------------------------------------------------
    #
    # Deep links such as /risk are client-side routes with no file behind them,
    # so unmatched paths fall through to index.html and the Angular router
    # resolves them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
