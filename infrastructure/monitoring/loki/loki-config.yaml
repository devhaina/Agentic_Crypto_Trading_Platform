# =============================================================================
# Agentiva — Loki
#
# Single-binary, filesystem-backed: appropriate for local development, not for
# production. A production deployment uses object storage and separate read and
# write paths; see docs/operations/observability.md.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Generous for local development. The services push directly from Serilog
  # with a bounded in-memory queue, so a Loki rejection costs log lines rather
  # than stalling a trading service.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_label_names_per_series: 20

  # Local retention. Production retains audit-adjacent logs far longer; the
  # durable audit record lives in audit_db, not here.
  retention_period: 168h

  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
