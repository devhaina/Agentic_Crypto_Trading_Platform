apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: agentiva-base

namespace: agentiva

# Order matters: the namespace and its service accounts must exist before the
# workloads that reference them.
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - secrets.yaml
  - networkpolicies.yaml
  - services.yaml
  - agent-platform.yaml
  - dashboard.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: agentiva
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/agentiva/api-gateway
    newTag: 0.1.0
