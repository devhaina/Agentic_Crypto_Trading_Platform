# =============================================================================
# Secret REFERENCES only.
#
# This file contains no secret values and never will. The manifests reference
# secrets by name; the values are supplied by one of:
#
#   * External Secrets Operator, syncing from Azure Key Vault or AWS Secrets
#     Manager (the intended production path — see the ExternalSecret below)
#   * Sealed Secrets, if a GitOps-committed encrypted form is preferred
#   * `kubectl create secret`, for a developer cluster only
#
# The exchange credential secret is mounted by the Execution Service and by
# nothing else. That is the entire basis of the claim that the AI platform
# cannot move funds: it is not that the AI is asked not to, it is that the
# credential is not present in its pod.
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: agentiva-vault
  namespace: agentiva
spec:
  provider:
    # Replace with the provider for the target cluster. Shown for Azure Key
    # Vault; the AWS and GCP providers are configured the same way.
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://REPLACE-ME.vault.azure.net"
      serviceAccountRef:
        name: agentiva-secrets-reader

---
# Infrastructure credentials, needed by most services.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentiva-infrastructure
  namespace: agentiva
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agentiva-vault
    kind: SecretStore
  target:
    name: agentiva-infrastructure
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: agentiva-postgres-password }
    - secretKey: TIMESCALE_PASSWORD
      remoteRef: { key: agentiva-timescale-password }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: agentiva-redis-password }
    - secretKey: RABBITMQ_USER
      remoteRef: { key: agentiva-rabbitmq-user }
    - secretKey: RABBITMQ_PASSWORD
      remoteRef: { key: agentiva-rabbitmq-password }
    - secretKey: JWT_SIGNING_KEY
      remoteRef: { key: agentiva-jwt-signing-key }

---
# Exchange credentials. Synced into a SEPARATE secret so that a pod can be
# granted infrastructure access without being granted exchange access, and so
# that access to this one secret can be audited on its own.
#
# Mounted only by the Execution Service deployment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentiva-exchange-credentials
  namespace: agentiva
  annotations:
    agentiva.io/sensitivity: "critical"
    agentiva.io/mounted-by: "execution-service"
    agentiva.io/key-requirements: >-
      Spot trading enabled; withdrawals DISABLED; restricted to the cluster's
      egress IPs; never reused across environments.
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agentiva-vault
    kind: SecretStore
  target:
    name: agentiva-exchange-credentials
    creationPolicy: Owner
  data:
    - secretKey: BINANCE_API_KEY
      remoteRef: { key: agentiva-binance-api-key }
    - secretKey: BINANCE_API_SECRET
      remoteRef: { key: agentiva-binance-api-secret }
