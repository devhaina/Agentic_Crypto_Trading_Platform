# =============================================================================
# Service accounts.
#
# One per service rather than a shared default, so that a secret, a role or an
# audit trail can be scoped to a single service. The Execution Service's
# account is the one that can read the exchange credential secret.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentiva-secrets-reader
  namespace: agentiva
  annotations:
    # Workload identity binding for the secret store. Replace per cluster.
    azure.workload.identity/client-id: "REPLACE-ME"
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentiva-service
  namespace: agentiva
  labels:
    app.kubernetes.io/part-of: agentiva
# No service needs to call the Kubernetes API, so no token is mounted. An
# unused mounted token is a credential sitting in every pod for an attacker to
# find.
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentiva-execution
  namespace: agentiva
  labels:
    app.kubernetes.io/part-of: agentiva
  annotations:
    agentiva.io/sensitivity: "critical"
    agentiva.io/note: >-
      The only identity permitted to read agentiva-exchange-credentials.
automountServiceAccountToken: false

---
# Grants read access to the exchange credential secret, and to nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentiva-exchange-credential-reader
  namespace: agentiva
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Named explicitly. A wildcard here would grant every secret in the
    # namespace and silently defeat the separation.
    resourceNames: ["agentiva-exchange-credentials"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentiva-exchange-credential-reader
  namespace: agentiva
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentiva-exchange-credential-reader
subjects:
  - kind: ServiceAccount
    name: agentiva-execution
    namespace: agentiva
