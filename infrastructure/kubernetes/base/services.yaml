                name: agentiva-common

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: POSTGRES_PASSWORD
            - name: TIMESCALE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: TIMESCALE_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: REDIS_PASSWORD
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: RABBITMQ_PASSWORD
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: JWT_SIGNING_KEY
            - name: ConnectionStrings__Timescale
              value: >-
                Host=timescaledb.agentiva.svc.cluster.local;Port=5432;Database=market_db;
                Username=agentiva;Password=$(TIMESCALE_PASSWORD)
            - name: ConnectionStrings__Redis
              value: redis.agentiva.svc.cluster.local:6379,password=$(REDIS_PASSWORD),abortConnect=false

          # --- Probes ------------------------------------------------------
          #
          # Liveness hits /alive, which is process-local. Readiness hits
