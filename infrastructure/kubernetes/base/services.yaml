# =============================================================================
# Agentiva — platform service workloads
#
# Generated from one template so that thirteen services stay consistent;
# committed as plain YAML and reviewed as such.
#
# Apply order: namespace, serviceaccounts, configmap, secrets, then this file.
# Use the Kustomize overlays in ../overlays rather than applying directly.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: agentiva
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: agentiva
    agentiva.io/tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: agentiva
    agentiva.io/tier: service
    spec:
      serviceAccountName: agentiva-service
      automountServiceAccountToken: false

      # Satisfies the restricted Pod Security Standard enforced on the
      # namespace. The images already run as a non-root user; this makes it a
      # hard requirement that admission checks.
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault

      # Long enough for in-flight requests and message handlers to finish and
      # acknowledge. Cutting a handler off mid-work produces a redelivery that
      # the inbox then has to de-duplicate.
      terminationGracePeriodSeconds: 45

      containers:
        - name: api-gateway
          image: ghcr.io/agentiva/api-gateway:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: agentiva-common

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: POSTGRES_PASSWORD
            - name: TIMESCALE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: TIMESCALE_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: REDIS_PASSWORD
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: RABBITMQ_PASSWORD
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: JWT_SIGNING_KEY
            - name: ConnectionStrings__Redis
              value: redis.agentiva.svc.cluster.local:6379,password=$(REDIS_PASSWORD),abortConnect=false

          # --- Probes ------------------------------------------------------
          #
          # Liveness hits /alive, which is process-local. Readiness hits
          # /ready, which includes dependencies. The distinction matters: a
          # liveness probe that checked the database would have the kubelet
          # kill and restart every replica during a database blip, turning a
          # recoverable outage into a cluster-wide crash loop.
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Gives the service time to apply its migrations before the liveness
          # probe can kill it.
          startupProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # No CPU limit, deliberately. A CPU limit causes CFS throttling,
              # which on a latency-sensitive trading path produces multi-
              # hundred-millisecond stalls that look like network problems.
              # The request guarantees a share; the memory limit is the hard
              # bound that matters.
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # The root filesystem is read-only, so the runtime needs a writable
            # temp directory.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: agentiva
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: agentiva
    agentiva.io/tier: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: agentiva
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Slow, and over a long window. Rapid scale-down on a trading platform
      # discards a replica that was mid-handler and causes an avoidable
      # redelivery.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: agentiva
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
