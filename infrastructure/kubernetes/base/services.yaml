                Username=agentiva;Password=$(POSTGRES_PASSWORD)
            - name: ConnectionStrings__Redis
              value: redis.agentiva.svc.cluster.local:6379,password=$(REDIS_PASSWORD),abortConnect=false

          # --- Probes ------------------------------------------------------
          #
          # Liveness hits /alive, which is process-local. Readiness hits
          # /ready, which includes dependencies. The distinction matters: a
          # liveness probe that checked the database would have the kubelet
          # kill and restart every replica during a database blip, turning a
          # recoverable outage into a cluster-wide crash loop.
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Gives the service time to apply its migrations before the liveness
          # probe can kill it.
          startupProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # No CPU limit, deliberately. A CPU limit causes CFS throttling,
              # which on a latency-sensitive trading path produces multi-
              # hundred-millisecond stalls that look like network problems.
              # The request guarantees a share; the memory limit is the hard
              # bound that matters.
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # The root filesystem is read-only, so the runtime needs a writable
            # temp directory.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: configuration-service
  namespace: agentiva
  labels:
    app.kubernetes.io/name: configuration-service
    app.kubernetes.io/part-of: agentiva
    agentiva.io/tier: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: configuration-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: configuration-service
  namespace: agentiva
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: configuration-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Slow, and over a long window. Rapid scale-down on a trading platform
      # discards a replica that was mid-handler and causes an avoidable
      # redelivery.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: configuration-service
  namespace: agentiva
  annotations:
    agentiva.io/note: >-
      maxUnavailable 0 on a single-replica service: a voluntary disruption such
      as a node drain must be blocked rather than take the service down. Drain
      requires an operator to scale up first or to accept the outage explicitly.
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: configuration-service
