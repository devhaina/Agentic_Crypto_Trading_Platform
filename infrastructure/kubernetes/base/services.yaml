apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
  namespace: agentiva
  labels:
    app.kubernetes.io/name: market-data-service
    app.kubernetes.io/part-of: agentiva
    agentiva.io/tier: service
spec:
  replicas: 1
      # Deliberately a single replica.
      #
      # This service holds a stateful, non-shardable position: the market data
      # service owns one exchange WebSocket subscription per symbol, and two
      # replicas would both subscribe and double-publish every tick. The
      # reconciliation service compares platform state against the exchange,
      # and two concurrent comparisons would race each other to disable
      # trading. Both become horizontally scalable once they use a distributed
      # lease; until then, scaling them out is a correctness bug rather than a
      # capacity improvement.
  selector:
    matchLabels:
      app.kubernetes.io/name: market-data-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
    app.kubernetes.io/name: market-data-service
    app.kubernetes.io/part-of: agentiva
    agentiva.io/tier: service
    spec:
      serviceAccountName: agentiva-service
      automountServiceAccountToken: false

      # Satisfies the restricted Pod Security Standard enforced on the
      # namespace. The images already run as a non-root user; this makes it a
      # hard requirement that admission checks.
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
