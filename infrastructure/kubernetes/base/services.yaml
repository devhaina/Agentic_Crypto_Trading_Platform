            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Gives the service time to apply its migrations before the liveness
          # probe can kill it.
          startupProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # No CPU limit, deliberately. A CPU limit causes CFS throttling,
              # which on a latency-sensitive trading path produces multi-
              # hundred-millisecond stalls that look like network problems.
              # The request guarantees a share; the memory limit is the hard
              # bound that matters.
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # The root filesystem is read-only, so the runtime needs a writable
            # temp directory.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

