apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: agentiva
  labels:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/part-of: agentiva
    agentiva.io/tier: service
spec:
  replicas: 1
      # One replica, and a RollingUpdate that never runs two at once.
      #
      # The execution service is the only component that can place an order.
      # Two replicas processing the same approved intent concurrently is the
      # duplicate-order scenario the whole idempotency design exists to
      # prevent, and defence in depth means not relying on it alone.
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/part-of: agentiva
    agentiva.io/tier: service
    spec:
      serviceAccountName: agentiva-execution
      automountServiceAccountToken: false

      # Satisfies the restricted Pod Security Standard enforced on the
      # namespace. The images already run as a non-root user; this makes it a
      # hard requirement that admission checks.
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault

      # Long enough for in-flight requests and message handlers to finish and
      # acknowledge. Cutting a handler off mid-work produces a redelivery that
      # the inbox then has to de-duplicate.
      terminationGracePeriodSeconds: 45

      containers:
        - name: execution-service
          image: ghcr.io/agentiva/execution-service:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: agentiva-common

