                  name: agentiva-infrastructure
                  key: POSTGRES_PASSWORD
            - name: TIMESCALE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: TIMESCALE_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: REDIS_PASSWORD
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: RABBITMQ_PASSWORD
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: agentiva-infrastructure
                  key: JWT_SIGNING_KEY
            - name: ConnectionStrings__Postgres
              value: >-
                Host=postgres.agentiva.svc.cluster.local;Port=5432;Database=execution_db;
                Username=agentiva;Password=$(POSTGRES_PASSWORD)
            - name: ConnectionStrings__Redis
              value: redis.agentiva.svc.cluster.local:6379,password=$(REDIS_PASSWORD),abortConnect=false
            # ---------------------------------------------------------------
            # Exchange credentials. Mounted by THIS deployment only.
            #
            # No other pod in the namespace references this secret, and the
            # RBAC Role permitting it names only the agentiva-execution
            # service account. The AI agent platform cannot read it, cannot
            # reach this service, and has no egress to an exchange.
            # ---------------------------------------------------------------
            - name: Binance__ApiKey
              valueFrom:
                secretKeyRef:
                  name: agentiva-exchange-credentials
                  key: BINANCE_API_KEY
            - name: Binance__ApiSecret
              valueFrom:
                secretKeyRef:
                  name: agentiva-exchange-credentials
                  key: BINANCE_API_SECRET

