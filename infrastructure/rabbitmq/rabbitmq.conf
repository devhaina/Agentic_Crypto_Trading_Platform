# =============================================================================
# Agentiva — RabbitMQ broker configuration
# =============================================================================

# Load the reviewed topology at start. Idempotent: existing entities are left
# alone, so a restart never destroys a queue with messages in it.
load_definitions = /etc/rabbitmq/definitions.json

# --- Resource limits ---------------------------------------------------------
#
# The broker blocks publishers when it approaches these. Blocking is the correct
# behaviour: a trading service that cannot publish an event will fail its
# transaction and retry, whereas a broker that runs out of memory loses
# messages that were already acknowledged.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# --- Connectivity -----------------------------------------------------------
heartbeat = 30
consumer_timeout = 1800000

# --- Management UI ----------------------------------------------------------
management.tcp.port = 15672

# --- Logging ----------------------------------------------------------------
log.console = true
log.console.level = info
log.file = false
