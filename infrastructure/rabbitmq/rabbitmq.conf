# =============================================================================
# Agentiva — RabbitMQ broker configuration
# =============================================================================

# Topology (exchanges, policies) is applied by the one-shot `rabbitmq-topology`
# container after boot, via the management HTTP API -- NOT via load_definitions
# here. RabbitMQ's boot-time definition import skips creating the
# RABBITMQ_DEFAULT_USER whenever it runs at all, even with an empty "users"
# array in the file, which would leave a fresh broker with zero accounts and
# every service failing authentication. A post-boot import has no such effect
# and is just as idempotent: existing entities are left alone, so it never
# destroys a queue with messages in it.

# --- Resource limits ---------------------------------------------------------
#
# The broker blocks publishers when it approaches these. Blocking is the correct
# behaviour: a trading service that cannot publish an event will fail its
# transaction and retry, whereas a broker that runs out of memory loses
# messages that were already acknowledged.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# --- Connectivity -----------------------------------------------------------
heartbeat = 30
consumer_timeout = 1800000

# --- Management UI ----------------------------------------------------------
management.tcp.port = 15672

# --- Logging ----------------------------------------------------------------
log.console = true
log.console.level = info
log.file = false
