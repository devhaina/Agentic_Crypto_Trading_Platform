# =============================================================================
# Agentiva — Redis configuration
#
# Redis is a cache and ephemeral-state store ONLY. It is never the source of
# truth for anything financial (Rule, §4) — the durable record of every
# balance, position and decision lives in PostgreSQL. Losing everything in
# this instance should degrade the platform's performance, never its
# correctness.
# =============================================================================

# --- Persistence --------------------------------------------------------
#
# AOF, not RDB-only snapshotting. The data here is cheap to lose (worst case:
# a cache miss, a staleness check that falls back to its safe default) but
# genuinely useful to keep across a restart — the kill-switch flag in
# particular should survive a Redis container recycling, not silently reset
# to "clear".
appendonly yes
appendfsync everysec

# --- Memory -----------------------------------------------------------------
#
# A hard cap with LRU eviction. Market ticks and cached snapshots are the bulk
# of what lives here and are all safely re-derivable, so evicting the least
# recently used key under pressure is the correct trade-off — never let Redis
# grow unbounded and risk the host OOM-killing it (or something else) instead.
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Networking ---------------------------------------------------------
#
# requirepass is supplied via the command line in docker-compose.yml /
# Kubernetes (from REDIS_PASSWORD), never written into this file — a password
# belongs in the environment or a secret manager, not in a file that gets
# mounted read-only into every environment identically.
protected-mode yes
tcp-keepalive 60
timeout 0

# --- Logging ------------------------------------------------------------
loglevel notice

# --- Safety -----------------------------------------------------------------
#
# Renamed rather than disabled: an operator occasionally needs FLUSHALL for a
# genuine cache-reset, but a bare `FLUSHALL` typed into the wrong terminal
# against the wrong Redis instance is a classic, entirely avoidable incident.
rename-command FLUSHALL AGENTIVA_FLUSHALL_CONFIRM
